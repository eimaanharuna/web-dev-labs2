<html>

<head>
    <title>Gallery of blues</title>
      <link rel="stylesheet" href = "css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/fomantic-ui/2.9.4/semantic.min.css">
    <style>
        body {
            background-color: white;

        background-image: url(images/wallpaper2.jpg);
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-size: cover;
        }
    a {
        text-decoration: none;
    }
    

        #container {
            margin: 1em auto;
            padding: 1em;
            width: 80%;
            border: solid rgb(0, 9, 128);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
        }
		.carousel {
    position: relative;
    width: 80%;
    max-width: 600px;
    overflow: hidden;
    border-radius: 10px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
}
        
.img-wrap {
    display: flex;
    transition: transform 0.5s ease;

}

.img-wrap img {
    width: 100%;
    height: auto;
    flex-shrink: 0;
}
button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    background: rgba(0, 0, 0, 0.5);
    color: #fff;
    border: none;
    padding: 10px;
    font-size: 16px;
    cursor: pointer;
    border-radius: 50%;
}

button:hover {
    background: rgba(0, 0, 0, 0.8);
}

.prev {
    left: 10px;
}

.next {
    right: 10px;
}

    </style>
</head>

<body>
    <div class="ui container">

        <header class="ui center aligned container">
    <h1 class="ui center aligned header" style="color: rgb(0, 0, 0); margin-bottom: 0;">Eimaan haruna</h1>
    
    <div class="ui breadcrumb" style="display: block; margin: 0 auto;">
        <a class="section" href="index.html">About Me</a>
        <div class="divider"> / </div>
        <div class="active section">
            ☆⋆｡𖦹°‧★ <a href="index.html">Click here to return to home page!</a>
        </div>
            <p id="tagline">"What you are not changing, you're choosing."</p>
        </header>
    <div id="container">
        <header>
            <h1>˖.𖥔 ݁ ˖ ⊹ Gallery of Blues ⋆｡°✩</h1>
        </header>
        <div class="carousel">
            <div class="img-wrap">
                <img src="images/gallery1.jpg">
                <img src="images/gallery2.jpg">
                <img src="images/gallery3.jpg">
                <img src="images/gallery4.jpg">
                <img src="images/gallery5.jpg">
                <img src="images/gallery6.jpg">
                <img src="images/gallery7.jpg">
                <img src="images/gallery8.jpg">
                <img src="images/gallery9.jpg">
                <img src="images/gallery10.jpg">
                <img src="images/gallery11.jpg">
                <img src="images/gallery12.jpg">
            </div>
            <button class="prev">♡</button>
            <button class="next">♡</button>
        </div>
    </div>
    <script>
    const prev = document.querySelector('.prev');
    const next = document.querySelector('.next');
    const wrap = document.querySelector('.img-wrap');
    const imgs = document.querySelectorAll('.img-wrap img');
        
	let idx = 0;
	
    const showImg= ()  => {
        if (idx >= imgs.length) idx = 0;
        if (idx < 0) idx = imgs.length - 1;
        wrap.style.transform = `translateX(-${idx * 100}%)`;
    }
        
	next.addEventListener('click', () => {
        idx++;
        showImg();
    });

    prev.addEventListener('click', () => {
        idx--;
        showImg();
    });
</script>


</body>

</html>
