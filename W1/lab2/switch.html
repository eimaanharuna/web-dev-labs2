 <!DOCTYPE html>
 <html lang="en">
 <head>
  <meta charset="utf-8">
  <title>Lab Two Exercise One</title>
 </head>
 <body>
 <h1>Switch Statement</h2>
 <p>Look in the console for output</p>
 <script>
    let colour=prompt("What traffic light colour would you like to know?" , "red")
    switch (colour) {
    case "red":
        console.log('Stop');
        break;
    case "yellow":
         console.log('Slow down');
        break;
    case "green":
        console.log('Go');
    default:
        console.log('Thank you')
    }
 </script>
 </body>
 </html>
