<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="utf-8">
 <title>Array of Objects</title>
 <style>
 
 table {
   width: 30%;
   border-collapse: collapse;
 }
 
 table, th, td {
   border: solid black 1px;
 }
 
 td {
    text-align: center;
 }
 </style>
</head>
<body>
<h1>Product</h1>
<table id="main-table"></table>

<div id="ex1"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.8/handlebars.min.js"></script>

<script id="highest-prices" type="text/x-handlebars-template">
  <h2>Most Expensive Items</h2>
  <table>
    <tr><th>Name</th><th>Category</th><th>Price</th><th>Rating</th><th>In Stock</th></tr>
    {{#each this}}
      <tr><td>{{name}}</td><td>{{upper category}}</td><td>{{price}}</td><td>{{rating}}</td><td>{{checkStock inStock}}</td></tr>
    {{/each}}
  </table>
</script>

<script id="cheapest-prices" type="text/x-handlebars-template">
  <h2>Cheapest Items</h2>
  <table>
    <tr><th>Name</th><th>Category</th><th>Price</th><th>Rating</th><th>In Stock</th></tr>
    {{#each this}}
      <tr><td>{{name}}</td><td>{{upper category}}</td><td>{{price}}</td><td>{{rating}}</td><td>{{checkStock inStock}}</td></tr>
    {{/each}}
  </table>
</script>

<script>
// ... (your products array and helpers remain the same) ...

const renderTemplate = (templateSelector, data, targetSelector) => {
  const templateSource = document.querySelector(templateSelector).innerHTML;
  const template = Handlebars.compile(templateSource);
  const output = template(data);
  const target = document.querySelector(targetSelector);
  return target.innerHTML += output; // += ensures they stack!
}

// 1. Render the main table
// (Note: I added id="main-table" to the HTML <table> above for better targeting)
renderTemplate('#original', products, '#main-table');

// 2. Logic for filtering
const prices = products.map(product => product.price);
let expensive = Math.max(...prices);
let highestPrices = products.filter(p => p.price === expensive);

let cheap = Math.min(...prices);
let cheapestProducts = products.filter(p => p.price === cheap);

// 3. Render the specific filtered lists to #ex1
// Make sure these IDs match the <script id="..."> exactly!
renderTemplate('#highest-prices', highestPrices, '#ex1');
renderTemplate('#cheapest-prices', cheapestProducts, '#ex1');
</script>
</body>
</html>
